<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Prediction System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 15px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #1e3c72; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        
        label { display: block; font-weight: bold; color: #333; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
        input:focus { outline: none; border-color: #1e3c72; }
        
        .btn { width: 100%; padding: 15px; background: #1e3c72; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn:hover { background: #2a5298; }
        .btn-outline { background: transparent; border: 2px solid #1e3c72; color: #1e3c72; }
        
        .row { display: flex; gap: 15px; }
        .row > div { flex: 1; }
        
        .hidden { display: none; }
        
        h2 { color: #1e3c72; margin: 25px 0 15px; }
        
        .result-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .result-box.high { border-left: 5px solid #e74c3c; }
        .result-box.low { border-left: 5px solid #27ae60; }
        
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
        .risk-high { color: #e74c3c; font-weight: bold; }
        .risk-low { color: #27ae60; font-weight: bold; }
        
        .chart-container { height: 250px; margin: 15px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #1e3c72; color: white; }
        
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab { padding: 12px 20px; cursor: pointer; }
        .tab.active { border-bottom: 3px solid #1e3c72; color: #1e3c72; font-weight: bold; }
        
        .message { padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .message.error { background: #ffebee; color: #c62828; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Flood Prediction System</h1>
            <p class="subtitle">Surma & Kushiyara River Basin</p>
            
            <div class="tabs">
                <div class="tab active" onclick="showTab('manual')">Manual Input</div>
                <div class="tab" onclick="showTab('api')">Fetch from API</div>
            </div>
            
            <div id="tab-manual">
                <label>Years (comma separated)</label>
                <input type="text" id="years" value="2016,2017,2018,2019,2020,2021,2022,2023,2024,2025">
                
                <label>Rainfall (mm)</label>
                <input type="text" id="rainfall" value="4210, 5120, 3950, 4480, 4100, 3850, 5430, 4320, 5080, 4250">
                
                <label>Average Temperature (Â°C)</label>
                <input type="text" id="avg_temp" value="25.8, 26.1, 25.9, 26.0, 25.7, 26.3, 26.5, 26.8, 26.4, 27.1">
                
                <div class="row">
                    <div>
                        <label>Surma Level (m)</label>
                        <input type="text" id="surma" value="11.45, 11.95, 10.80, 11.35, 11.10, 10.50, 13.00, 11.05, 12.45, 11.15">
                    </div>
                    <div>
                        <label>Kushiyara Level (m)</label>
                        <input type="text" id="kushiyara" value="13.20, 14.10, 12.85, 13.50, 13.15, 12.40, 17.57, 13.10, 15.20, 13.35">
                    </div>
                </div>
            </div>
            
            <div id="tab-api" class="hidden">
                <label>Select Location</label>
                <select id="location">
                    <option value="24.8918,91.8697">Sylhet</option>
                    <option value="24.9045,91.8611">Sylhet City</option>
                    <option value="24.4829,91.7703">Moulvibazar</option>
                    <option value="24.3745,91.4155">Habiganj</option>
                    <option value="25.0667,91.4000">Sunamganj</option>
                </select>
                
                <label>Start Year</label>
                <input type="number" id="api_year" value="2020">
                
                <button type="button" class="btn btn-outline" onclick="fetchData()">Fetch Weather Data</button>
                
                <div id="api_message"></div>
            </div>
            
            <label> Predict Year</label>
            <input type="number" id="predict_year" value="2027">
            
            <label>Surma Flood Threshold (m)</label>
            <input type="number" id="threshold_surma" value="13" step="0.1">
            
            <label>Kushiyara Flood Threshold (m)</label>
            <input type="number" id="threshold_kushi" value="15" step="0.1">
            
            <button type="button" class="btn" onclick="predict()">Predict Flood Risk</button>
        </div>
        
        <div class="card hidden" id="result">
            <h1>Prediction Results</h1>
            <p class="subtitle">Year <span id="result_year"></span></p>
            
            <div class="result-box" id="surma_box">
                <h3>ðŸš¤ Surma River</h3>
                <div class="data-row"><span>Water Level</span><span id="surma_level"></span></div>
                <div class="data-row"><span>Flood Risk</span><span id="surma_risk"></span></div>
            </div>
            
            <div class="result-box" id="kushi_box">
                <h3>ðŸŒŠ Kushiyara River</h3>
                <div class="data-row"><span>Water Level</span><span id="kushi_level"></span></div>
                <div class="data-row"><span>Flood Risk</span><span id="kushi_risk"></span></div>
            </div>
            
            <h2>Rainfall Trend</h2>
            <div class="chart-container"><canvas id="chart_rain"></canvas></div>
            
            <h2>Water Level</h2>
            <div class="chart-container"><canvas id="chart_water"></canvas></div>
            
            <h2>Historical Data</h2>
            <table id="table_data">
                <thead><tr><th>Year</th><th>Rain</th><th>Temp</th><th>Surma</th><th>Kushi</th></tr></thead>
                <tbody></tbody>
            </table>
            
            <button type="button" class="btn" onclick="goBack()">ï¿½ï¿½ Back</button>
        </div>
    </div>
    
    <script>
        var charts = [];
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            event.target.classList.add('active');
            
            if (tab === 'manual') {
                document.getElementById('tab-manual').classList.remove('hidden');
                document.getElementById('tab-api').classList.add('hidden');
            } else {
                document.getElementById('tab-manual').classList.add('hidden');
                document.getElementById('tab-api').classList.remove('hidden');
            }
        }
        
        function parseList(str) {
            if (!str) return [];
            return str.split(',').map(function(x) { return parseFloat(x.trim()); }).filter(function(x) { return !isNaN(x); });
        }
        
        function mean(arr) {
            return arr.reduce(function(a, b) { return a + b; }, 0) / arr.length;
        }
        
        function slope(x, y) {
            var xm = mean(x), ym = mean(y);
            var num = 0, den = 0;
            for (var i = 0; i < x.length; i++) {
                num += (x[i] - xm) * (y[i] - ym);
                den += (x[i] - xm) * (x[i] - xm);
            }
            return den === 0 ? 0 : num / den;
        }
        
        function intercept(x, y, m) {
            return mean(y) - m * mean(x);
        }
        
        function fetchData() {
            var loc = document.getElementById('location').value.split(',');
            var lat = loc[0], lon = loc[1];
            var startYear = parseInt(document.getElementById('api_year').value);
            
            var msg = document.getElementById('api_message');
            msg.textContent = 'Loading...';
            
            var url = 'https://archive-api.open-meteo.com/v1/archive?latitude=' + lat + '&longitude=' + lon + 
                '&start_date=' + startYear + '-01-01&end_date=2025-12-31&daily=precipitation_sum,temperature_2m_mean&timezone=auto';
            
            fetch(url)
                .then(function(response) {
                    if (!response.ok) {
                        msg.textContent = 'Error: HTTP ' + response.status;
                        return null;
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (!data) return;
                    
                    if (data.error) {
                        msg.textContent = 'Error: ' + data.error;
                        return;
                    }
                    
                    if (!data.daily || !data.daily.time) {
                        msg.textContent = 'No data found';
                        return;
                    }
                        return;
                    }
                    
                    var daily = data.daily;
                    var years = [], rain = [], temp = [];
                    var yearlyRain = {}, yearlyTemp = {};
                    
                    for (var i = 0; i < daily.time.length; i++) {
                        var y = parseInt(daily.time[i].substring(0, 4));
                        if (!yearlyRain[y]) {
                            yearlyRain[y] = 0;
                            yearlyTemp[y] = [];
                        }
                        if (daily.precipitation_sum[i]) yearlyRain[y] += daily.precipitation_sum[i];
                        if (daily.temperature_2m_mean[i]) yearlyTemp[y].push(daily.temperature_2m_mean[i]);
                    }
                    
                    Object.keys(yearlyRain).sort().forEach(function(y) {
                        years.push(y);
                        rain.push(Math.round(yearlyRain[y]));
                        var sum = yearlyTemp[y].reduce(function(a, b) { return a + b; }, 0);
                        temp.push(Math.round(sum / yearlyTemp[y].length * 10) / 10);
                    });
                    
                    document.getElementById('years').value = years.join(',');
                    document.getElementById('rainfall').value = rain.join(', ');
                    document.getElementById('avg_temp').value = temp.join(', ');
                    
                    msg.textContent = 'Loaded ' + years.length + ' years!';
                })
                .catch(function(e) {
                    msg.textContent = 'Error: ' + e.message;
                });
        }
        
        function predict() {
            var years = parseList(document.getElementById('years').value);
            var rainfall = parseList(document.getElementById('rainfall').value);
            var avgTemp = parseList(document.getElementById('avg_temp').value);
            var surma = parseList(document.getElementById('surma').value);
            var kushiyara = parseList(document.getElementById('kushiyara').value);
            var predictYear = parseInt(document.getElementById('predict_year').value);
            var threshSurma = parseFloat(document.getElementById('threshold_surma').value);
            var threshKushi = parseFloat(document.getElementById('threshold_kushi').value);
            
            if (years.length < 2 || rainfall.length < 2) {
                alert('Need at least 2 years of data');
                return;
            }
            
            var rM = slope(years, rainfall);
            var rB = intercept(years, rainfall, rM);
            var predRain = Math.round((rM * predictYear + rB) * 100) / 100;
            
            var sM = slope(rainfall, surma);
            var sB = intercept(rainfall, surma, sM);
            var predSurma = Math.round((sM * predRain + sB) * 100) / 100;
            
            var kM = slope(rainfall, kushiyara);
            var kB = intercept(rainfall, kushiyara, kM);
            var predKushi = Math.round((kM * predRain + kB) * 100) / 100;
            
            var surmaRisk = predSurma > threshSurma ? 'HIGH' : 'LOW';
            var kushiRisk = predKushi > threshKushi ? 'HIGH' : 'LOW';
            
            document.getElementById('result_year').textContent = predictYear;
            document.getElementById('surma_level').textContent = predSurma + ' m';
            document.getElementById('surma_risk').textContent = surmaRisk;
            document.getElementById('surma_risk').className = 'risk-' + surmaRisk.toLowerCase();
            document.getElementById('surma_box').className = 'result-box ' + surmaRisk.toLowerCase();
            
            document.getElementById('kushi_level').textContent = predKushi + ' m';
            document.getElementById('kushi_risk').textContent = kushiRisk;
            document.getElementById('kushi_risk').className = 'risk-' + kushiRisk.toLowerCase();
            document.getElementById('kushi_box').className = 'result-box ' + kushiRisk.toLowerCase();
            
            var tbody = document.querySelector('#table_data tbody');
            var html = '';
            for (var i = 0; i < years.length; i++) {
                html += '<tr><td>' + years[i] + '</td><td>' + rainfall[i] + '</td><td>' + avgTemp[i] + '</td><td>' + surma[i] + '</td><td>' + kushiyara[i] + '</td></tr>';
            }
            tbody.innerHTML = html;
            
            charts.forEach(function(c) { c.destroy(); });
            charts = [];
            
            var allYears = years.concat([predictYear]);
            var allRain = rainfall.concat([predRain]);
            var allSurma = surma.concat([predSurma]);
            var allKushi = kushiyara.concat([predKushi]);
            
            charts.push(new Chart(document.getElementById('chart_rain'), {
                type: 'line',
                data: { labels: allYears, datasets: [{ label: 'Rainfall (mm)', data: allRain, borderColor: '#1e3c72', fill: true }] }
            }));
            
            charts.push(new Chart(document.getElementById('chart_water'), {
                type: 'line',
                data: { labels: allYears, datasets: [
                    { label: 'Surma', data: allSurma, borderColor: '#3498db' },
                    { label: 'Kushiyara', data: allKushi, borderColor: '#27ae60' }
                ] }
            }));
            
            document.getElementById('result').classList.remove('hidden');
            document.querySelector('.container > .card').classList.add('hidden');
            window.scrollTo(0, 0);
        }
        
        function goBack() {
            document.getElementById('result').classList.add('hidden');
            document.querySelector('.container > .card').classList.remove('hidden');
        }
    </script>
</body>
</html>
